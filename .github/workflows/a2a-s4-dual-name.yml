name: A2A dual-name candidate regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/a2a-s4-dual-name-2026-10-02/**'
      - 'interop/a2a-s3-retain-2026-10-01/**'
      - '.github/workflows/a2a-s4-dual-name.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/a2a-s4-dual-name-2026-10-02/**'
      - 'interop/a2a-s3-retain-2026-10-01/**'
      - '.github/workflows/a2a-s4-dual-name.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/a2a-s4-dual-name-2026-10-02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install selected regression dependencies
        run: python -m pip install -r ../a2a-s3-retain-2026-10-01/requirements.txt
      - name: Test alias and signature controls
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Recompute both native readings
        run: python run_dual_name.py > fresh-report.json
      - name: Retain report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a2a-s4-dual-name-report
          path: interop/a2a-s4-dual-name-2026-10-02/fresh-report.json
          if-no-files-found: error
          retention-days: 90
